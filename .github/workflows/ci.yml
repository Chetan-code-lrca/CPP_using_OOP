name: C++ Example

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Compile
        run: g++ -std=c++17 -Wall -Wextra -pedantic virtual_functions.cpp -o virtual_functions
      - name: Verify runtime output
        shell: bash
        run: |
          ./virtual_functions > actual.txt
          printf 'One\nTwo\nThree\n' > expected.txt
          diff -u expected.txt actual.txt
